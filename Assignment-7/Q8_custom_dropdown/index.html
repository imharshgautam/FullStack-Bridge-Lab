<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom JavaScript Dropdown</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Custom Dropdown</h1>
    <div class="dropdown" id="dropdown">
      <button id="dropdown-button" type="button" aria-expanded="false">Choose a framework-free option</button>
      <ul id="dropdown-options" hidden>
        <li><button type="button" data-value="JavaScript">JavaScript</button></li>
        <li><button type="button" data-value="HTML">HTML</button></li>
        <li><button type="button" data-value="CSS">CSS</button></li>
        <li><button type="button" data-value="Node.js">Node.js</button></li>
      </ul>
    </div>
    <p id="selection">No option selected.</p>
  </main>
</body>
</html>
