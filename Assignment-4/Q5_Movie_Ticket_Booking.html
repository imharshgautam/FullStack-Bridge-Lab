<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 35px auto; padding: 0 16px; }
        label { display: block; margin: 14px 0; }
        input { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; }
        .error { color: red; }
        #ticket { margin-top: 20px; padding: 14px; border: 1px dashed #555; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Movie Ticket Booking</h1>
    <form id="bookingForm" novalidate>
        <label>Name <input id="bookingName" name="name"></label>
        <label>Email <input id="bookingEmail" name="email" type="email"></label>
        <label>Seats (1–10) <input id="bookingSeats" name="seats" type="number" min="1" max="10"></label>
        <button type="submit">Book Tickets</button>
    </form>
    <p id="bookingError" class="error" role="alert"></p>
    <div id="ticket">Your ticket details will appear here.</div>
    <script src="Q5_Movie_Ticket_Booking.js"></script>
</body>
</html>
