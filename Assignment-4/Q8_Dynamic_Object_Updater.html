<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 35px auto; padding: 0 16px; }
        label { display: block; margin: 14px 0; }
        input { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; }
        pre { background: #f3f3f3; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Edit User</h1>
    <form id="userForm">
        <label>Name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Age <input name="age" type="number" min="0" required></label>
        <button type="submit">Update User</button>
    </form>
    <h2>Updated object</h2>
    <pre id="userOutput"></pre>
    <script src="Q8_Dynamic_Object_Updater.js"></script>
</body>
</html>
